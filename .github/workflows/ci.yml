      - name: Build personal module and app
        env:
          K_VAL: ${{ inputs.k }}
          TRAIN: ${{ matrix.train }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cd src
          TRAIN_FLAG="--no-train"
          if [ "$TRAIN" = "1" ]; then TRAIN_FLAG=""; fi
          scripts/builder/build.sh "../disc.iso" \
            --combined-optimizations --lean-blocks --lean-memory --lean-deadlines --behaviour-timing \
            $TRAIN_FLAG --device-cpu apple-a13 --ipa build/out.ipa
          grep -h "native-entries\|tiered\|hooked\|cache operations\|translated functions executed" build/device/logs/*.log | tail -30 || true
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          ipa = pathlib.Path("build/out.ipa")
          with zipfile.ZipFile(ipa, "a") as z:
              z.writestr("Payload/BlueWake.app/DrawFusion", "1\n")
          key = hashlib.sha256(os.environ["K_VAL"].encode()).digest()
          data = ipa.read_bytes()
          n = len(data)
          ks = bytearray(n + 64)
          for off in range(0, n, 64):
              ks[off:off+64] = hashlib.blake2b(off.to_bytes(8, "little"), key=key).digest()
          del ks[n:]
          out = (int.from_bytes(data, "little") ^ int.from_bytes(ks, "little")).to_bytes(n, "little")
          pathlib.Path("build/output.dat").write_bytes(out)
          PY

      - name: Upload encrypted output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.variant }}
          path: src/build/output.dat
          retention-days: 3
