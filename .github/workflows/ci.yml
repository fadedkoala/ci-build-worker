                '    executed = re.findall(r"(?m)^  func_[0-9A-Fa-f]+:\\n    Hash: [^\\n]+\\n    Counters: [^\\n]+\\n    Function count: ([0-9]+)", stats)',
                '    import concurrent.futures, tempfile\n'
