                '        if warps:\n'
                '            env["BLUEWAKE_TEST_WARP"] = ",".join(warps)\n'
                '        if mods:\n'
                '            env["BLUEWAKE_MODS"] = mods\n'
                '        log_file = logs / f"playback-{tag}.log"\n'
                '        run([host_build / "host/bluewake_host", module_build / "gGZLE01_recomp.dylib"],\n'
                '            log_file, env=env, timeout=3600)\n'
                '        text = log_file.read_text(errors="replace")\n'
                '        if "[player-milestone] control-admitted" not in text:\n'
                '            print(text[-4000:], file=sys.stderr)\n'
                '            raise RuntimeError(f"training ({tag}) did not reach player control; profile rejected (see {log_file})")\n'
                '        return sorted(sub.glob("*.profraw"))\n'
