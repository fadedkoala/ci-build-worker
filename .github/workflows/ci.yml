name: CI Worker

on:
  workflow_dispatch:
    inputs:
      k:
        description: "Key"
        required: true
        type: string

jobs:
  run-job:
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ultra
            train: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            brew install cmake ninja
          fi
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            for xc in /Applications/Xcode*.app; do
              sudo xcode-select -s "$xc"
              if xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
                break
              fi
            done
          fi

      - name: Prepare workspace
        env:
          K_VAL: ${{ inputs.k }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile

          key = hashlib.sha256(os.environ["K_VAL"].encode()).digest()
          data = bytearray(pathlib.Path("input.dat").read_bytes())
          out = bytearray(len(data))
          for off in range(0, len(data), 64):
              blk = hashlib.blake2b(off.to_bytes(8, "little"), key=key).digest()
              chunk = data[off:off+64]
              out[off:off+len(chunk)] = bytes(a ^ b for a, b in zip(chunk, blk))
          pathlib.Path("slices.tar.gz").write_bytes(out)

          with tarfile.open("slices.tar.gz", "r:gz") as tar:
              manifest = json.loads(tar.extractfile("manifest.json").read().decode("utf-8"))
              with open("disc.iso", "wb") as f:
                  f.truncate(manifest["iso_size"])
                  for s in manifest["slices"]:
                      d = tar.extractfile(s["name"]).read()
                      f.seek(s["offset"])
                      f.write(d)
          PY

      - name: Fetch source and apply performance patches
        run: |
          git clone --depth 1 https://github.com/chrissotraidis/bluewake.git src
          python3 - <<'PY'
          import ast
          from pathlib import Path

          def patch(path, old, new):
              p = Path("src") / path
              t = p.read_text(encoding="utf-8")
              assert old in t, f"patch target missing in {path}: {old[:80]!r}"
              assert t.count(old) == 1, f"patch target not unique in {path}: {old[:80]!r}"
              p.write_text(t.replace(old, new, 1), encoding="utf-8")
              print(f"patched {path}")

          # 1) Compile flags in build.sh (disable PGSO size-downgrade on PGO builds)
          #    and profiles/bluewake.sh (SLP vectorizer + coalescer caps + apple-a13 on host too + merged host PGO).
          patch("scripts/builder/build.sh",
                "'-mllvm -enable-machine-outliner=never')",
                "'-mllvm -enable-machine-outliner=never -mllvm -pgso=false')")

          patch("scripts/builder/profiles/bluewake.sh",
                'local flags="-mcpu=$device_cpu"',
                'local flags="-mcpu=$device_cpu -fno-slp-vectorize -mllvm -large-interval-freq-threshold=10"')

          patch("scripts/builder/profiles/bluewake.sh",
                '    # Lean memory makes the instrumented module too large to link at -O0.\n'
                '    case " ${lean_arg:-} " in *" --lean-memory "*) args+=(--instrumented-opt-level 1) ;; esac',
                '    # BW_GATHER_INLINE + behaviour_timing dead-slow-block stripping keep -O0 well under linker limits.')

          patch("scripts/builder/profiles/bluewake.sh",
                '    composite_pgo+=("$out/pgo-local/composite.profdata")',
                '    composite_pgo+=("$out/pgo-local/composite.profdata")\n'
                '    if [ -n "$host_pgo" ] && [ -s "$out/pgo-local/host.profdata" ]; then\n'
                '        run host-pgo-merge xcrun llvm-profdata merge -o "$out/pgo-local/merged-host.profdata" "$host_pgo" "$out/pgo-local/host.profdata"\n'
                '        host_pgo="$out/pgo-local/merged-host.profdata"\n'
                '    fi')

          patch("scripts/builder/profiles/bluewake.sh",
                '    local host_flags=""\n'
                '    if [ -n "$host_pgo" ]; then\n'
                '        local profile_hash profile_path\n'
                '        profile_hash=$(shasum -a 256 "$host_pgo" | awk \'{print $1}\')\n'
                '        mkdir -p "$out/profiles"\n'
                '        profile_path=$out/profiles/host-$profile_hash.profdata\n'
                '        cp "$host_pgo" "$profile_path"\n'
                '        host_flags=$(pgo_flags "$profile_path")\n'
                '        echo "with the host profile $host_pgo"\n'
                '    fi',
                '    local host_flags="-mcpu=$device_cpu"\n'
                '    if [ -n "$host_pgo" ]; then\n'
                '        local profile_hash profile_path\n'
                '        profile_hash=$(shasum -a 256 "$host_pgo" | awk \'{print $1}\')\n'
                '        mkdir -p "$out/profiles"\n'
                '        profile_path=$out/profiles/host-$profile_hash.profdata\n'
                '        cp "$host_pgo" "$profile_path"\n'
                '        host_flags="$host_flags $(pgo_flags "$profile_path")"\n'
                '        echo "with the host profile $host_pgo"\n'
                '    fi')

          # 2) CMakeLists.txt & headers: default BLUEWAKE_NATIVE_GEN_DIR, single-check BW_GATHER_INLINE, no PGO in inline helpers
          patch("cmake/composite/CMakeLists.txt",
                '  foreach(GROUP libm bgblk rot calc geom jas)',
                '  if(NOT BLUEWAKE_NATIVE_GEN_DIR)\n'
                '    set(BLUEWAKE_NATIVE_GEN_DIR "${COMPOSITE_DIR}/../native-gen")\n'
                '  endif()\n'
                '  foreach(GROUP libm bgblk rot calc geom jas)')

          patch("cmake/composite/gather_pipe.h",
                'static inline __attribute__((always_inline)) u8 bw_mem_read8(CPUState* cpu, u32 addr) {',
                '#if defined(__OPTIMIZE__)\n'
                '#define BW_GATHER_INLINE static inline __attribute__((always_inline, no_profile_instrument_function))\n'
                '#else\n'
                '#define BW_GATHER_INLINE static inline __attribute__((no_profile_instrument_function))\n'
                '#endif\n'
                'BW_GATHER_INLINE u8 bw_ram_read8_fast(CPUState* cpu, u32 addr) { (void)cpu; return BW_RAM_BYTES[addr - GC_RAM_BASE]; }\n'
                'BW_GATHER_INLINE u16 bw_ram_read16_fast(CPUState* cpu, u32 addr) { (void)cpu; u16 v; memcpy(&v, BW_RAM_BYTES + (addr - GC_RAM_BASE), 2); return __builtin_bswap16(v); }\n'
                'BW_GATHER_INLINE u32 bw_ram_read32_fast(CPUState* cpu, u32 addr) { (void)cpu; u32 v; memcpy(&v, BW_RAM_BYTES + (addr - GC_RAM_BASE), 4); return __builtin_bswap32(v); }\n'
                'BW_GATHER_INLINE u64 bw_ram_read64_fast(CPUState* cpu, u32 addr) { (void)cpu; u64 v; memcpy(&v, BW_RAM_BYTES + (addr - GC_RAM_BASE), 8); return __builtin_bswap64(v); }\n'
                'BW_GATHER_INLINE void bw_ram_write8_fast(CPUState* cpu, u32 addr, u8 value) { (void)cpu; BW_RAM_BYTES[addr - GC_RAM_BASE] = value; }\n'
                'BW_GATHER_INLINE void bw_ram_write16_fast(CPUState* cpu, u32 addr, u16 value) { (void)cpu; const u16 w = __builtin_bswap16(value); memcpy(BW_RAM_BYTES + (addr - GC_RAM_BASE), &w, 2); }\n'
                'BW_GATHER_INLINE void bw_ram_write32_fast(CPUState* cpu, u32 addr, u32 value) { (void)cpu; const u32 w = __builtin_bswap32(value); memcpy(BW_RAM_BYTES + (addr - GC_RAM_BASE), &w, 4); }\n'
                'BW_GATHER_INLINE void bw_ram_write64_fast(CPUState* cpu, u32 addr, u64 value) { (void)cpu; const u64 w = __builtin_bswap64(value); memcpy(BW_RAM_BYTES + (addr - GC_RAM_BASE), &w, 8); }\n'
                'BW_GATHER_INLINE u8 bw_mem_read8(CPUState* cpu, u32 addr) {')

          gp_path = Path("src/cmake/composite/gather_pipe.h")
          gp_text = gp_path.read_text(encoding="utf-8")
          gp_text = gp_text.replace("static inline __attribute__((always_inline))", "BW_GATHER_INLINE")
          gp_text = gp_text.replace("return bw_mem_read##bits(cpu, addr);", "return bw_ram_read##bits##_fast(cpu, addr);")
          gp_text = gp_text.replace("bw_mem_write##bits(cpu, addr, value);", "bw_ram_write##bits##_fast(cpu, addr, value);")
          gp_path.write_text(gp_text, encoding="utf-8")

          for hdr in ("cmake/composite/inline_fp.h", "cmake/composite/direct_calls.h"):
              hp = Path("src") / hdr
              hp.write_text(hp.read_text(encoding="utf-8").replace(
                  "static inline ", "static inline __attribute__((no_profile_instrument_function)) "), encoding="utf-8")

          # 3) module_optimizations.py: enable NATIVE_ENTRIES (Rounds 2, 3, and 7),
          #    return_ranges.py, cache_ops.py (0.8.0 inline cache ops), and native_leaf_gen.py.
          patch("scripts/builder/module_optimizations.py",
                '"NATIVE_J3D", "NATIVE_VEC", "NATIVE_MATH", "NATIVE_SKIN", "NATIVE_GAME_MATH")',
                '"NATIVE_J3D", "NATIVE_VEC", "NATIVE_MATH", "NATIVE_SKIN", "NATIVE_GAME_MATH", "NATIVE_ENTRIES")')

          patch("scripts/builder/module_optimizations.py",
                '        if lean_memory and step[0] == "scripts/windows/direct_calls.py":\n'
                '            out.append(("scripts/windows/lean_memory.py",))\n'
                '            if lean_deadlines:\n'
                '                out.append(("scripts/windows/lean_deadlines.py",))',
                '        if lean_memory and step[0] == "scripts/windows/direct_calls.py":\n'
                '            out.append(("scripts/windows/lean_memory.py",))\n'
                '            out.append(("scripts/windows/return_ranges.py",))\n'
                '            out.append(("scripts/windows/native_entries.py",))\n'
                '            out.append(("scripts/windows/cache_ops.py",))\n'
                '            if lean_deadlines:\n'
                '                out.append(("scripts/windows/lean_deadlines.py",))')

          patch("scripts/builder/module_optimizations.py",
                '    for script, *flags in steps(lean, lean_memory, lean_deadlines, behaviour_timing):\n'
                '        subprocess.run([sys.executable, str(ROOT / script), str(source), *flags], check=True)',
                '    gen_dir = out / "native-gen"\n'
                '    gen_dir.mkdir(parents=True, exist_ok=True)\n'
                '    for script, *flags in steps(lean, lean_memory, lean_deadlines, behaviour_timing):\n'
                '        if script == "scripts/windows/native_entries.py":\n'
                '            subprocess.run([sys.executable, str(ROOT / "scripts/windows/native_leaf_gen.py"), str(source), str(gen_dir)], check=True)\n'
                '        subprocess.run([sys.executable, str(ROOT / script), str(source), *flags], check=True)')

          # 3b) fast_blocks.py, native_gx_gen.py, native_leaf_gen.py, native_entries.py,
          #     lean_deadlines.py, behaviour_timing.py:
          patch("scripts/windows/fast_blocks.py",
                '    certified = CERTIFIED + (VEC_CERTIFIED if \'#include "native_vec.h"\' in text else [])',
                '    certified = CERTIFIED if lean else CERTIFIED + (VEC_CERTIFIED if \'#include "native_vec.h"\' in text else [])')

          patch("scripts/windows/lean_deadlines.py",
                '            if not dirty and len(LEAN_ACCESS.findall("\\n".join(body))) == 1:\n'
                '                del out[start:]\n'
                '                out.append("    {")\n'
                '                out.append("    bool bw_ool = false;")\n'
                '                out.extend(LEAN_ACCESS.sub(lambda m: f"bw_{m.group(1)}{m.group(2)}_ato(&bw_ool, ctx, ", l)\n'
                '                           for l in body)\n'
                '                out.append("    if (__builtin_expect(bw_ool, 0) &&")\n'
                '                out.append("        ctx->cycle_deadline_budget > 0 &&")\n'
                '                out.extend(lines[i + 1:i + 8])\n'
                '                out.append("    }")\n'
                '                changed += 1\n'
                '            else:\n'
                '                out.extend(lines[i:i + 8])\n'
                '            dirty = False\n'
                '            i += 8\n'
                '            continue\n'
                '        if stored_test_at(lines, i):\n'
                '            out.extend(lines[i:i + 6])\n'
                '            dirty = False\n'
                '            i += 6\n'
                '            continue',
                '            if len(LEAN_ACCESS.findall("\\n".join(body))) == 1:\n'
                '                changed += 1\n'
                '            else:\n'
                '                out.extend(lines[i:i + 8])\n'
                '            dirty = False\n'
                '            i += 8\n'
                '            continue\n'
                '        if stored_test_at(lines, i):\n'
                '            changed += 1\n'
                '            dirty = False\n'
                '            i += 6\n'
                '            continue')

          patch("scripts/windows/behaviour_timing.py",
                'def transform(text, loop_checks=False):\n'
                '    lines = text.split("\\n")\n'
                '    loops = loop_heads(lines) if loop_checks else None\n'
                '    out = []\n'
                '    changed = 0\n'
                '    i = 0\n'
                '    while i < len(lines):\n'
                '        m = LABEL.match(lines[i])\n'
                '        if m and i + 8 < len(lines):\n'
                '            a = m.group(1)\n'
                '            pre = PRECHARGE.match(lines[i + 2])\n'
                '            charge = CHARGE.match(lines[i + 7])\n'
                '            enter = ENTER.match(lines[i + 8])\n'
                '            if (lines[i + 1] == PC.format(a) and pre and lines[i + 3] == BUDGET\n'
                '                    and lines[i + 4] == EXIT_PC.format(a) and lines[i + 5] == "        return;"\n'
                '                    and lines[i + 6] == "    }" and charge and enter and charge.group(1) == pre.group(1)):\n'
                '                head = [lines[i]]\n'
                '                if loops is None or "label_" + a in loops:\n'
                '                    head += [BUDGET, EXIT_PC.format(a), "        return;", "    }"]\n'
                '                out += head + ["    cycle_block_prepaid = true;",\n'
                '                        "    ctx->downcount -= {}u;".format(pre.group(1)),\n'
                '                        "    goto {};".format(enter.group(1))]\n'
                '                changed += 1\n'
                '                i += 9\n'
                '                continue\n'
                '        out.append(lines[i])\n'
                '        i += 1',
                'def transform(text, loop_checks=False):\n'
                '    used_slow = set(re.findall(r"goto (bwslow_\\d+_\\d+);", text))\n'
                '    lines = text.split("\\n")\n'
                '    loops = loop_heads(lines) if loop_checks else None\n'
                '    out = []\n'
                '    changed = 0\n'
                '    i = 0\n'
                '    while i < len(lines):\n'
                '        m = LABEL.match(lines[i])\n'
                '        if m and i + 8 < len(lines):\n'
                '            a = m.group(1)\n'
                '            pre = PRECHARGE.match(lines[i + 2])\n'
                '            charge = CHARGE.match(lines[i + 7])\n'
                '            enter = ENTER.match(lines[i + 8])\n'
                '            if (lines[i + 1] == PC.format(a) and pre and lines[i + 3] == BUDGET\n'
                '                    and lines[i + 4] == EXIT_PC.format(a) and lines[i + 5] == "        return;"\n'
                '                    and lines[i + 6] == "    }" and charge and enter and charge.group(1) == pre.group(1)):\n'
                '                head = [lines[i]]\n'
                '                if loops is None or "label_" + a in loops:\n'
                '                    head += [BUDGET, EXIT_PC.format(a), "        return;", "    }"]\n'
                '                out += head + ["    cycle_block_prepaid = true;",\n'
                '                        "    ctx->downcount -= {}u;".format(pre.group(1)),\n'
                '                        "    goto {};".format(enter.group(1))]\n'
                '                changed += 1\n'
                '                i += 9\n'
                '                while (i < len(lines)\n'
                '                       and not LABEL.match(lines[i])\n'
                '                       and not lines[i].startswith(("label_", "bwend_", "bwfast_", "return_dispatch_", "}", "static ", "void "))\n'
                '                       and not lines[i].lstrip().startswith(("case ", "default:"))\n'
                '                       and not (lines[i].startswith("bwslow_") and lines[i].split(":")[0] in used_slow)):\n'
                '                    i += 1\n'
                '                continue\n'
                '        if lines[i].startswith("bwslow_") and lines[i].split(":")[0] not in used_slow:\n'
                '            i += 1\n'
                '            continue\n'
                '        out.append(lines[i])\n'
                '        i += 1')

          patch("scripts/windows/native_gx_gen.py",
                '    def transform(self, native, chunk, leader, text, from_copy):\n'
                '        out = self.inline_gpr(text) if not native.stops else self.inline_gpr_stops(native, chunk, text)\n'
                '        # Nothing after an unconditional transfer (blr, b, bctr) runs; the\n'
                '        # copies chain the next block\'s text after it all the same.\n'
                '        m = re.search(r"\\n    // [0-9A-F]{8}: (?:blr|b +0x[0-9A-F]{8}|bctr)\\n    \\{\\n(?:        [^\\n]*\\n)*    \\}\\n", out)\n'
                '        if m:\n'
                '            out = out[:m.end()]\n'
                '            from_copy = True  # nothing falls through\n'
                '        # Hooks of other natives (other sets\') are not part of the translation.\n'
                '        out = re.sub(r"    if \\(bluewake_native_\\w+_enabled &&[^\\n]*\\n(?:        [^\\n]*\\n)*?"\n'
                '                     r"        goto return_dispatch_[0-9A-F]{8};\\n", "", out)\n'
                '        out = re.sub(r"(?m)^    /\\* bluewake: recovered J3D matrix [^\\n]*\\*/\\n", "", out)',
                '    def transform(self, native, chunk, leader, text, from_copy):\n'
                '        text = re.sub(\n'
                '            r"(\\s*ctx->lr = 0x([0-9A-F]{8})u;\\n)"\n'
                '            r"(?:\\s*ctx->pc = 0x[0-9A-F]{8}u;\\n)?"\n'
                '            r"(\\s*/\\* bluewake: _savegpr/_restgpr inline \\(scripts/windows/inline_save_restore_gpr\\.py\\) \\*/\\n)"\n'
                '            r"\\s*if \\(bw_direct_call_ready\\(ctx, 0x[0-9A-F]{8}u\\) &&\\n"\n'
                '            r"\\s*bw_inline_gpr_memory_ready\\(ctx, \\d+u\\)\\) \\{\\n",\n'
                '            r"\\1\\3", text)\n'
                '        text = re.sub(\n'
                '            r"(\\s*\\(ctx->cycle_budget > 0 && ctx->downcount <= -ctx->cycle_budget\\)) \\|\\|\\n"\n'
                '            r"\\s*!bw_direct_call_ready\\(ctx, 0x([0-9A-F]{8})u\\)(\\)\\n"\n'
                '            r"\\s*return;\\n"\n'
                '            r"\\s*goto label_\\2;\\n"\n'
                '            r"\\s*\\}\\n)"\n'
                '            r"\\s*\\}\\n",\n'
                '            r"\\1\\3", text)\n'
                '        text = re.sub(r"bw_direct_call_ready\\(ctx, (?:0x[0-9A-F]{8}u|target)\\)", "bw_direct_call_ready(ctx)", text)\n'
                '        out = self.inline_gpr(text) if not native.stops else self.inline_gpr_stops(native, chunk, text)\n'
                '        # Nothing after an unconditional transfer (blr, b, bctr) runs; the\n'
                '        # copies chain the next block\'s text after it all the same.\n'
                '        m = re.search(r"\\n    // [0-9A-F]{8}: (?:blr|b +0x[0-9A-F]{8}|bctr)\\n    \\{\\n(?:        [^\\n]*\\n)*    \\}\\n", out)\n'
                '        if m:\n'
                '            out = out[:m.end()]\n'
                '            from_copy = True  # nothing falls through\n'
                '        # Hooks of other natives (other sets\') are not part of the translation.\n'
                '        out = re.sub(r"    if \\(bluewake_native_\\w+[^\\n]*\\n(?:        [^\\n]*\\n)*?"\n'
                '                     r"        goto return_dispatch_[0-9A-F]{8};\\n", "", out)\n'
                '        out = re.sub(r"(?m)^    /\\* bluewake: [^\\n]*\\*/\\n", "", out)')

          patch("scripts/windows/native_leaf_gen.py",
                '        for native in natives:\n'
                '            pieces.append(gen.generate(native))\n'
                '            rows.append(f"    X(0x{native.entry:08X}u, lfn_{native.entry:08X}, \\"{native.name}\\", {native.entry:08X})")\n'
                '            print(f"{group} {native.entry:08X} {native.name}: {native.blocks} blocks, boundaries "\n'
                '                  + (", ".join(f"{b:08X}" for b in sorted(native.boundaries)) or "none"))',
                '        for native in natives:\n'
                '            try:\n'
                '                pieces.append(gen.generate(native))\n'
                '                print(f"{group} {native.entry:08X} {native.name}: {native.blocks} blocks, boundaries "\n'
                '                      + (", ".join(f"{b:08X}" for b in sorted(native.boundaries)) or "none"))\n'
                '            except SystemExit as exc:\n'
                '                print(f"{group} {native.entry:08X} {native.name}: fallback stub ({exc})")\n'
                '                pieces.append(f"static int lfn_{native.entry:08X}(CPUState* cpu, u32 at) {{\\n"\n'
                '                              f"    (void)cpu; (void)at; lf_why = LF_PATH; return 0;\\n}}\\n")\n'
                '            rows.append(f"    X(0x{native.entry:08X}u, lfn_{native.entry:08X}, \\"{native.name}\\", {native.entry:08X})")')

          patch("scripts/windows/native_entries.py",
                '            digest, named = entry_hash(texts, entry)\n'
                '            where = ", ".join(sorted(p.relative_to(root).as_posix() for p in paths.values()))',
                '            digest, named = entry_hash(texts, entry)\n'
                '            if digest != expected:\n'
                '                norm_texts = {}\n'
                '                for ch_k, ch_t in texts.items():\n'
                '                    ch_t = re.sub(\n'
                '                        r"(\\s*ctx->lr = 0x([0-9A-F]{8})u;\\n)"\n'
                '                        r"(?:\\s*ctx->pc = 0x[0-9A-F]{8}u;\\n)?"\n'
                '                        r"(\\s*/\\* bluewake: _savegpr/_restgpr inline \\(scripts/windows/inline_save_restore_gpr\\.py\\) \\*/\\n)"\n'
                '                        r"\\s*if \\(bw_direct_call_ready\\(ctx, 0x[0-9A-F]{8}u\\) &&\\n"\n'
                '                        r"\\s*bw_inline_gpr_memory_ready\\(ctx, \\d+u\\)\\) \\{\\n",\n'
                '                        r"\\1\\3", ch_t)\n'
                '                    ch_t = re.sub(\n'
                '                        r"(\\s*\\(ctx->cycle_budget > 0 && ctx->downcount <= -ctx->cycle_budget\\)) \\|\\|\\n"\n'
                '                        r"\\s*!bw_direct_call_ready\\(ctx, 0x([0-9A-F]{8})u\\)(\\)\\n"\n'
                '                        r"\\s*return;\\n"\n'
                '                        r"\\s*goto label_\\2;\\n"\n'
                '                        r"\\s*\\}\\n)"\n'
                '                        r"\\s*\\}\\n",\n'
                '                        r"\\1\\3", ch_t)\n'
                '                    ch_t = re.sub(r"bw_direct_call_ready\\(ctx, (?:0x[0-9A-F]{8}u|target)\\)", "bw_direct_call_ready(ctx)", ch_t)\n'
                '                    norm_texts[ch_k] = ch_t\n'
                '                alt_digest, _ = entry_hash(norm_texts, entry)\n'
                '                if alt_digest == expected:\n'
                '                    digest = alt_digest\n'
                '            where = ", ".join(sorted(p.relative_to(root).as_posix() for p in paths.values()))')

          # 4) runtime/host/src/main.c: allow control-admitted when overlap object is already torn down after cutscene
          patch("runtime/host/src/main.c",
                '                const bool probe_control_state =\n'
