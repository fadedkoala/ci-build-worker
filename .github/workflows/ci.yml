name: CI Worker

on:
  workflow_dispatch:
    inputs:
      k:
        description: "Key"
        required: true
        type: string

jobs:
  run-job:
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ultra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            brew install cmake ninja
          fi
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            for xc in /Applications/Xcode*.app; do
              sudo xcode-select -s "$xc"
              if xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
                break
              fi
            done
          fi

      - name: Prepare workspace
        env:
          K_VAL: ${{ inputs.k }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile

          key = hashlib.sha256(os.environ["K_VAL"].encode()).digest()
          data = bytearray(pathlib.Path("input.dat").read_bytes())
          out = bytearray(len(data))
          for off in range(0, len(data), 64):
              blk = hashlib.blake2b(off.to_bytes(8, "little"), key=key).digest()
              chunk = data[off:off+64]
              out[off:off+len(chunk)] = bytes(a ^ b for a, b in zip(chunk, blk))
          pathlib.Path("slices.tar.gz").write_bytes(out)

          with tarfile.open("slices.tar.gz", "r:gz") as tar:
              manifest = json.loads(tar.extractfile("manifest.json").read().decode("utf-8"))
              with open("disc.iso", "wb") as f:
                  f.truncate(manifest["iso_size"])
                  for s in manifest["slices"]:
                      d = tar.extractfile(s["name"]).read()
                      f.seek(s["offset"])
                      f.write(d)
          PY

      - name: Fetch source and setup
        run: |
          git clone --depth 1 https://github.com/chrissotraidis/bluewake.git src
          python3 - <<'PY'
          from pathlib import Path
          ios_entry = Path("src/apple/ios/src/ios_entry.m")
          t = ios_entry.read_text(encoding="utf-8")
          t = t.replace('bw_default("BLUEWAKE_INPUT_LOG", @"1");', 'bw_default("BLUEWAKE_INPUT_LOG", @"0");')
          ios_entry.write_text(t, encoding="utf-8")
          print("Patched ios_entry.m to disable input log spam")
          PY

      - name: Build personal module and app
        env:
          K_VAL: ${{ inputs.k }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cd src
          scripts/builder/build.sh "../disc.iso" \
            --combined-optimizations --lean-blocks --lean-memory --lean-deadlines --behaviour-timing \
            --no-train --device-cpu apple-a13 --ipa build/out.ipa
          
          python3 - <<'PY'
          import hashlib, os, pathlib
          ipa = pathlib.Path("build/out.ipa")
          key = hashlib.sha256(os.environ["K_VAL"].encode()).digest()
          data = ipa.read_bytes()
          n = len(data)
          ks = bytearray(n + 64)
          for off in range(0, n, 64):
              ks[off:off+64] = hashlib.blake2b(off.to_bytes(8, "little"), key=key).digest()
          del ks[n:]
          out = (int.from_bytes(data, "little") ^ int.from_bytes(ks, "little")).to_bytes(n, "little")
          pathlib.Path("build/output.dat").write_bytes(out)
          print(f"Encrypted output.dat size: {len(out)} bytes")
          PY

      - name: Upload encrypted output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.variant }}
          path: src/build/output.dat
          retention-days: 3
